<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Student Portal</title>
    <link rel="stylesheet" href="../css/student.css">
</head>
<body>
    <div class="student-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🎓 Student Portal</h2>
                <p id="studentName">Loading...</p>
            </div>
            
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="alerts.html" class="active">🚨 Alerts</a></li>
                <li><a href="events.html">📅 Events</a></li>
                <li><a href="profile.html">👤 Profile</a></li>
                <li><a href="#" onclick="logout()">🚪 Logout</a></li>
            </ul>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>My Alerts</h1>
                <div class="header-actions">
                    <button class="btn-secondary" onclick="markAllRead()">✅ Mark All Read</button>
                    <button class="btn-secondary" onclick="refreshAlerts()">🔄 Refresh</button>
                </div>
            </header>
            
            <!-- Alert Filters -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="statusFilter">Status:</label>
                    <select id="statusFilter" onchange="filterAlerts()">
                        <option value="all">All Alerts</option>
                        <option value="unread">Unread Only</option>
                        <option value="read">Read Only</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="typeFilter">Type:</label>
                    <select id="typeFilter" onchange="filterAlerts()">
                        <option value="all">All Types</option>
                        <option value="institution">Institution-wide</option>
                        <option value="course">Course-specific</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="searchInput">Search:</label>
                    <input type="text" id="searchInput" placeholder="Search alerts..." onkeyup="filterAlerts()">
                </div>
            </div>
            
            <!-- Alerts List -->
            <div class="alerts-container">
                <div class="alerts-header">
                    <h3>📬 All Alerts</h3>
                    <span id="alertCount" class="alert-count">Loading...</span>
                </div>
                
                <div class="alerts-list" id="alertsList">
                    <div class="loading">Loading alerts...</div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Alert Details Modal -->
    <div id="alertModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📧 Alert Details</h3>
                <button class="modal-close" onclick="closeAlertModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="alert-details" id="alertDetails">
                    <!-- Alert details will be loaded here -->
                </div>
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeAlertModal()">Close</button>
                <button type="button" class="btn-primary" id="markReadBtn" onclick="markAlertRead()">Mark as Read</button>
            </div>
        </div>
    </div>
    
    <script src="../js/student.js"></script>
    <script>
        let allAlerts = [];
        let currentAlert = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadAlerts();
        });
        
        async function loadAlerts() {
            const alertsList = document.getElementById('alertsList');
            alertsList.innerHTML = '<div class="loading">Loading alerts...</div>';
            
            try {
                const response = await apiCall('/alerts/received');
                allAlerts = response.alerts || [];
                
                // Add read status (in a real app, this would come from the API)
                allAlerts = allAlerts.map(alert => ({
                    ...alert,
                    isRead: Math.random() > 0.3 // Random read status for demo
                }));
                
                displayAlerts(allAlerts);
                updateAlertCount(allAlerts);
            } catch (error) {
                console.error('Failed to load alerts:', error);
                alertsList.innerHTML = '<div class="error">Failed to load alerts</div>';
            }
        }
        
        function displayAlerts(alerts) {
            const alertsList = document.getElementById('alertsList');
            
            if (alerts.length === 0) {
                alertsList.innerHTML = '<div class="empty-state">No alerts found</div>';
                return;
            }
            
            alertsList.innerHTML = alerts.map(alert => `
                <div class="alert-card ${!alert.isRead ? 'unread' : ''}" onclick="viewAlert(${alert.id})">
                    <div class="alert-header">
                        <div class="alert-meta">
                            <span class="alert-type ${alert.recipient_type === 'all' ? 'institution' : 'course'}">
                                ${alert.recipient_type === 'all' ? '🏫 Institution' : '📚 Course'}
                            </span>
                            <span class="alert-date">${formatDateTime(alert.sent_at)}</span>
                        </div>
                        ${!alert.isRead ? '<span class="unread-indicator">●</span>' : ''}
                    </div>
                    
                    <div class="alert-content">
                        <h4>${alert.subject}</h4>
                        <p class="alert-preview">${truncateText(alert.message, 100)}</p>
                        <div class="alert-sender">
                            <span>From: ${alert.sender_name}</span>
                            ${alert.course_name ? `<span>Course: ${alert.course_name}</span>` : ''}
                        </div>
                    </div>
                    
                    <div class="alert-actions">
                        <button class="btn-icon" onclick="event.stopPropagation(); toggleReadStatus(${alert.id})" title="${alert.isRead ? 'Mark as Unread' : 'Mark as Read'}">
                            ${alert.isRead ? '📭' : '📬'}
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function updateAlertCount(alerts) {
            const total = alerts.length;
            const unread = alerts.filter(alert => !alert.isRead).length;
            
            document.getElementById('alertCount').textContent = `${total} total, ${unread} unread`;
        }
        
        function filterAlerts() {
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredAlerts = [...allAlerts];
            
            // Filter by status
            if (statusFilter === 'unread') {
                filteredAlerts = filteredAlerts.filter(alert => !alert.isRead);
            } else if (statusFilter === 'read') {
                filteredAlerts = filteredAlerts.filter(alert => alert.isRead);
            }
            
            // Filter by type
            if (typeFilter === 'institution') {
                filteredAlerts = filteredAlerts.filter(alert => alert.recipient_type === 'all');
            } else if (typeFilter === 'course') {
                filteredAlerts = filteredAlerts.filter(alert => alert.recipient_type === 'course');
            }
            
            // Filter by search term
            if (searchTerm) {
                filteredAlerts = filteredAlerts.filter(alert =>
                    alert.subject.toLowerCase().includes(searchTerm) ||
                    alert.message.toLowerCase().includes(searchTerm) ||
                    alert.sender_name.toLowerCase().includes(searchTerm)
                );
            }
            
            displayAlerts(filteredAlerts);
        }
        
        function viewAlert(alertId) {
            currentAlert = allAlerts.find(alert => alert.id === alertId);
            if (!currentAlert) return;
            
            const alertDetails = document.getElementById('alertDetails');
            alertDetails.innerHTML = `
                <div class="alert-full">
                    <div class="alert-meta-full">
                        <div class="meta-item">
                            <label>From:</label>
                            <span>${currentAlert.sender_name}</span>
                        </div>
                        <div class="meta-item">
                            <label>Type:</label>
                            <span>${currentAlert.recipient_type === 'all' ? 'Institution-wide' : 'Course-specific'}</span>
                        </div>
                        ${currentAlert.course_name ? `
                        <div class="meta-item">
                            <label>Course:</label>
                            <span>${currentAlert.course_name}</span>
                        </div>
                        ` : ''}
                        <div class="meta-item">
                            <label>Sent:</label>
                            <span>${formatDateTime(currentAlert.sent_at)}</span>
                        </div>
                    </div>
                    
                    <div class="alert-subject">
                        <h3>${currentAlert.subject}</h3>
                    </div>
                    
                    <div class="alert-message">
                        <p>${currentAlert.message.replace(/\n/g, '<br>')}</p>
                    </div>
                </div>
            `;
            
            // Update mark read button
            const markReadBtn = document.getElementById('markReadBtn');
            if (currentAlert.isRead) {
                markReadBtn.textContent = 'Mark as Unread';
                markReadBtn.onclick = () => markAlertUnread();
            } else {
                markReadBtn.textContent = 'Mark as Read';
                markReadBtn.onclick = () => markAlertRead();
            }
            
            document.getElementById('alertModal').style.display = 'flex';
            
            // Auto-mark as read when viewed
            if (!currentAlert.isRead) {
                setTimeout(() => {
                    markAlertRead(false); // Don't close modal
                }, 1000);
            }
        }
        
        function closeAlertModal() {
            document.getElementById('alertModal').style.display = 'none';
            currentAlert = null;
        }
        
        function toggleReadStatus(alertId) {
            const alert = allAlerts.find(a => a.id === alertId);
            if (!alert) return;
            
            alert.isRead = !alert.isRead;
            
            // In a real app, this would make an API call
            showNotification(`Alert marked as ${alert.isRead ? 'read' : 'unread'}`, 'success');
            
            // Refresh display
            filterAlerts();
            updateAlertCount(allAlerts);
        }
        
        function markAlertRead(closeModal = true) {
            if (!currentAlert) return;
            
            currentAlert.isRead = true;
            
            // In a real app, this would make an API call
            showNotification('Alert marked as read', 'success');
            
            // Update display
            filterAlerts();
            updateAlertCount(allAlerts);
            
            if (closeModal) {
                closeAlertModal();
            } else {
                // Update button
                const markReadBtn = document.getElementById('markReadBtn');
                markReadBtn.textContent = 'Mark as Unread';
                markReadBtn.onclick = () => markAlertUnread();
            }
        }
        
        function markAlertUnread() {
            if (!currentAlert) return;
            
            currentAlert.isRead = false;
            
            showNotification('Alert marked as unread', 'success');
            
            // Update display
            filterAlerts();
            updateAlertCount(allAlerts);
            closeAlertModal();
        }
        
        function markAllRead() {
            if (confirm('Mark all alerts as read?')) {
                allAlerts.forEach(alert => {
                    alert.isRead = true;
                });
                
                showNotification('All alerts marked as read', 'success');
                
                // Update display
                filterAlerts();
                updateAlertCount(allAlerts);
            }
        }
        
        function refreshAlerts() {
            loadAlerts();
        }
        
        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.style.display = 'none';
            }
        });
    </script>
</body>
</html>
