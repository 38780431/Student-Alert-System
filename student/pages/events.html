<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Student Portal</title>
    <link rel="stylesheet" href="../css/student.css">
</head>
<body>
    <div class="student-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🎓 Student Portal</h2>
                <p id="studentName">Loading...</p>
            </div>
            
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="alerts.html">🚨 Alerts</a></li>
                <li><a href="events.html" class="active">📅 Events</a></li>
                <li><a href="profile.html">👤 Profile</a></li>
                <li><a href="#" onclick="logout()">🚪 Logout</a></li>
            </ul>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Academic Events</h1>
                <div class="header-actions">
                    <select id="viewMode" onchange="changeViewMode()">
                        <option value="list">📋 List View</option>
                        <option value="calendar">📅 Calendar View</option>
                    </select>
                </div>
            </header>
            
            <!-- Event Filters -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="typeFilter">Type:</label>
                    <select id="typeFilter" onchange="filterEvents()">
                        <option value="all">All Events</option>
                        <option value="institution">Institution-wide</option>
                        <option value="course">Course-specific</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="timeFilter">Time:</label>
                    <select id="timeFilter" onchange="filterEvents()">
                        <option value="all">All Time</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="thisWeek">This Week</option>
                        <option value="thisMonth">This Month</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="searchInput">Search:</label>
                    <input type="text" id="searchInput" placeholder="Search events..." onkeyup="filterEvents()">
                </div>
            </div>
            
            <!-- List View -->
            <div id="listView" class="events-container">
                <div class="events-header">
                    <h3>📅 Academic Calendar</h3>
                    <span id="eventCount" class="event-count">Loading...</span>
                </div>
                
                <div class="events-timeline" id="eventsTimeline">
                    <div class="loading">Loading events...</div>
                </div>
            </div>
            
            <!-- Calendar View -->
            <div id="calendarView" class="calendar-container" style="display: none;">
                <div class="calendar-header">
                    <button class="btn-secondary" onclick="previousMonth()">‹</button>
                    <h3 id="currentMonth">Loading...</h3>
                    <button class="btn-secondary" onclick="nextMonth()">›</button>
                </div>
                
                <div class="calendar-grid" id="calendarGrid">
                    <div class="loading">Loading calendar...</div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Event Details Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📅 Event Details</h3>
                <button class="modal-close" onclick="closeEventModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="event-details" id="eventDetails">
                    <!-- Event details will be loaded here -->
                </div>
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeEventModal()">Close</button>
                <button type="button" class="btn-primary" onclick="addToCalendar()">📅 Add to Calendar</button>
            </div>
        </div>
    </div>
    
    <script src="../js/student.js"></script>
    <script>
        let allEvents = [];
        let currentEvent = null;
        let currentDate = new Date();
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadEvents();
        });
        
        async function loadEvents() {
            try {
                const response = await apiCall('/events');
                allEvents = response.events || [];
                
                // Sort events by date
                allEvents.sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
                
                displayEvents(allEvents);
                updateEventCount(allEvents);
                updateCalendarHeader();
            } catch (error) {
                console.error('Failed to load events:', error);
                document.getElementById('eventsTimeline').innerHTML = '<div class="error">Failed to load events</div>';
            }
        }
        
        function displayEvents(events) {
            const timeline = document.getElementById('eventsTimeline');
            
            if (events.length === 0) {
                timeline.innerHTML = '<div class="empty-state">No events found</div>';
                return;
            }
            
            // Group events by date
            const groupedEvents = groupEventsByDate(events);
            
            timeline.innerHTML = Object.entries(groupedEvents).map(([date, dayEvents]) => {
                const eventDate = new Date(date);
                const isToday = eventDate.toDateString() === new Date().toDateString();
                const isPast = eventDate < new Date() && !isToday;
                
                return `
                    <div class="timeline-group ${isToday ? 'today' : ''} ${isPast ? 'past' : ''}">
                        <div class="timeline-date">
                            <div class="date-circle ${isToday ? 'today' : ''}">
                                <span class="day">${eventDate.getDate()}</span>
                                <span class="month">${eventDate.toLocaleDateString('en', {month: 'short'})}</span>
                            </div>
                            <div class="date-info">
                                <h4>${eventDate.toLocaleDateString('en', {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'})}</h4>
                                ${isToday ? '<span class="today-badge">Today</span>' : ''}
                            </div>
                        </div>
                        
                        <div class="timeline-events">
                            ${dayEvents.map(event => `
                                <div class="event-card ${isPast ? 'past' : ''}" onclick="viewEvent(${event.id})">
                                    <div class="event-time">
                                        ${formatTime(event.event_date)}
                                    </div>
                                    <div class="event-content">
                                        <h5>${event.title}</h5>
                                        <p>${event.course_name || 'Institution-wide'}</p>
                                        ${event.description ? `<small>${truncateText(event.description, 80)}</small>` : ''}
                                    </div>
                                    <div class="event-type">
                                        <span class="type-badge ${event.event_type}">
                                            ${event.event_type === 'institution' ? '🏫' : '📚'}
                                        </span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function groupEventsByDate(events) {
            return events.reduce((groups, event) => {
                const date = new Date(event.event_date).toDateString();
                if (!groups[date]) {
                    groups[date] = [];
                }
                groups[date].push(event);
                return groups;
            }, {});
        }
        
        function updateEventCount(events) {
            const total = events.length;
            const upcoming = events.filter(event => new Date(event.event_date) >= new Date()).length;
            
            document.getElementById('eventCount').textContent = `${total} total, ${upcoming} upcoming`;
        }
        
        function filterEvents() {
            const typeFilter = document.getElementById('typeFilter').value;
            const timeFilter = document.getElementById('timeFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredEvents = [...allEvents];
            
            // Filter by type
            if (typeFilter === 'institution') {
                filteredEvents = filteredEvents.filter(event => event.event_type === 'institution');
            } else if (typeFilter === 'course') {
                filteredEvents = filteredEvents.filter(event => event.event_type === 'course');
            }
            
            // Filter by time
            const now = new Date();
            if (timeFilter === 'upcoming') {
                filteredEvents = filteredEvents.filter(event => new Date(event.event_date) >= now);
            } else if (timeFilter === 'thisWeek') {
                const weekFromNow = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
                filteredEvents = filteredEvents.filter(event => {
                    const eventDate = new Date(event.event_date);
                    return eventDate >= now && eventDate <= weekFromNow;
                });
            } else if (timeFilter === 'thisMonth') {
                const monthFromNow = new Date(now.getFullYear(), now.getMonth() + 1, now.getDate());
                filteredEvents = filteredEvents.filter(event => {
                    const eventDate = new Date(event.event_date);
                    return eventDate >= now && eventDate <= monthFromNow;
                });
            }
            
            // Filter by search term
            if (searchTerm) {
                filteredEvents = filteredEvents.filter(event =>
                    event.title.toLowerCase().includes(searchTerm) ||
                    (event.description && event.description.toLowerCase().includes(searchTerm)) ||
                    (event.course_name && event.course_name.toLowerCase().includes(searchTerm))
                );
            }
            
            displayEvents(filteredEvents);
            updateEventCount(filteredEvents);
        }
        
        function changeViewMode() {
            const viewMode = document.getElementById('viewMode').value;
            const listView = document.getElementById('listView');
            const calendarView = document.getElementById('calendarView');
            
            if (viewMode === 'calendar') {
                listView.style.display = 'none';
                calendarView.style.display = 'block';
                generateCalendar();
            } else {
                listView.style.display = 'block';
                calendarView.style.display = 'none';
            }
        }
        
        function generateCalendar() {
            const calendarGrid = document.getElementById('calendarGrid');
            
            // Get first day of month and number of days
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());
            
            // Generate calendar grid
            let calendarHTML = `
                <div class="calendar-weekdays">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                </div>
                <div class="calendar-days">
            `;
            
            for (let i = 0; i < 42; i++) {
                const cellDate = new Date(startDate);
                cellDate.setDate(startDate.getDate() + i);
                
                const isCurrentMonth = cellDate.getMonth() === currentDate.getMonth();
                const isToday = cellDate.toDateString() === new Date().toDateString();
                
                // Get events for this day
                const dayEvents = allEvents.filter(event => 
                    new Date(event.event_date).toDateString() === cellDate.toDateString()
                );
                
                calendarHTML += `
                    <div class="calendar-day ${isCurrentMonth ? 'current-month' : 'other-month'} ${isToday ? 'today' : ''}">
                        <div class="day-number">${cellDate.getDate()}</div>
                        <div class="day-events">
                            ${dayEvents.slice(0, 3).map(event => `
                                <div class="calendar-event ${event.event_type}" onclick="viewEvent(${event.id})">
                                    ${truncateText(event.title, 15)}
                                </div>
                            `).join('')}
                            ${dayEvents.length > 3 ? `<div class="more-events">+${dayEvents.length - 3} more</div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            calendarHTML += '</div>';
            calendarGrid.innerHTML = calendarHTML;
        }
        
        function updateCalendarHeader() {
            document.getElementById('currentMonth').textContent = 
                currentDate.toLocaleDateString('en', {month: 'long', year: 'numeric'});
        }
        
        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateCalendarHeader();
            generateCalendar();
        }
        
        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateCalendarHeader();
            generateCalendar();
        }
        
        function viewEvent(eventId) {
            currentEvent = allEvents.find(event => event.id === eventId);
            if (!currentEvent) return;
            
            const eventDetails = document.getElementById('eventDetails');
            eventDetails.innerHTML = `
                <div class="event-full">
                    <div class="event-meta-full">
                        <div class="meta-item">
                            <label>Date & Time:</label>
                            <span>${formatDateTime(currentEvent.event_date)}</span>
                        </div>
                        <div class="meta-item">
                            <label>Type:</label>
                            <span>${currentEvent.event_type === 'institution' ? 'Institution-wide' : 'Course-specific'}</span>
                        </div>
                        ${currentEvent.course_name ? `
                        <div class="meta-item">
                            <label>Course:</label>
                            <span>${currentEvent.course_name}</span>
                        </div>
                        ` : ''}
                        <div class="meta-item">
                            <label>Created by:</label>
                            <span>${currentEvent.created_by_name}</span>
                        </div>
                    </div>
                    
                    <div class="event-title">
                        <h3>${currentEvent.title}</h3>
                    </div>
                    
                    ${currentEvent.description ? `
                    <div class="event-description">
                        <h4>Description:</h4>
                        <p>${currentEvent.description.replace(/\n/g, '<br>')}</p>
                    </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('eventModal').style.display = 'flex';
        }
        
        function closeEventModal() {
            document.getElementById('eventModal').style.display = 'none';
            currentEvent = null;
        }
        
        function addToCalendar() {
            if (!currentEvent) return;
            
            // Create calendar event URL (Google Calendar format)
            const startDate = new Date(currentEvent.event_date);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000); // 1 hour duration
            
            const formatDate = (date) => {
                return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };
            
            const calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(currentEvent.title)}&dates=${formatDate(startDate)}/${formatDate(endDate)}&details=${encodeURIComponent(currentEvent.description || '')}&location=${encodeURIComponent(currentEvent.course_name || 'Institution')}`;
            
            window.open(calendarUrl, '_blank');
        }
        
        function formatTime(dateString) {
            return new Date(dateString).toLocaleTimeString('en', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function truncateText(text, maxLength) {
            if (!text || text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.style.display = 'none';
            }
        });
    </script>
</body>
</html>
